<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Админка — списки</title>
    <link rel="icon" type="image/svg+xml" href="favicon-admin.svg">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="container wide">
            <a class="admin-brand" href="index.html">MY<span>COLLECTION</span></a>
            <nav class="admin-nav" aria-label="Разделы админки">
                <a href="admin.html">➕ Добавление</a>
                <a href="admin.html#top100">🏆 ТОП-100</a>
                <a href="database.html">📋 База</a>
                <a href="lists.html">🗂️ Списки</a>
            </nav>
        </div>
    </header>

    <main class="container wide">
        <div class="layout">
            <aside class="panel">
                <h2>Списки</h2>
                <form class="row" id="createForm">
                    <input type="text" id="newListInput" placeholder="Новый список" aria-label="Название нового списка">
                    <button type="submit" class="btn btn-primary" aria-label="Создать список">+</button>
                </form>
                <div class="mt" id="listsNav"><div class="empty-state">Загрузка…</div></div>
            </aside>

            <section class="panel" id="contentPanel">
                <div class="empty-state">Выберите список или создайте новый</div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        let items = [];
        let lists = [];
        let selected = null;

        async function load() {
            try {
                const [data, rows] = await Promise.all([
                    run(db.from('collection').select('id,type,title,poster,year,rating,customlists')),
                    run(db.from('lists').select('name'))
                ]);
                items = data;
                // Списки из таблицы lists плюс те, что встречаются только у фильмов
                const names = new Set(rows.map(r => r.name));
                items.forEach(i => splitList(i.customlists).forEach(n => names.add(n)));
                lists = [...names].sort((a, b) => a.localeCompare(b, 'ru'));
            } catch (error) {
                $('listsNav').innerHTML = '<div class="empty-state">Не удалось загрузить данные.</div>';
                console.error(error);
                return;
            }
            if (!lists.includes(selected)) selected = null;
            renderNav();
            renderContent();
        }

        const inList = (name) => items.filter(i => splitList(i.customlists).includes(name));

        function renderNav() {
            $('listsNav').innerHTML = lists.length
                ? lists.map(name => `
                    <button type="button" class="list-link${name === selected ? ' active' : ''}" data-list="${escapeHtml(name)}">
                        <span>📌 ${escapeHtml(name)}</span><span class="count">${inList(name).length}</span>
                    </button>`).join('')
                : '<div class="empty-state">Пока нет ни одного списка.</div>';
        }

        function renderContent() {
            const panel = $('contentPanel');
            if (!selected) {
                panel.innerHTML = '<div class="empty-state">Выберите список или создайте новый</div>';
                return;
            }
            const movies = inList(selected);
            panel.innerHTML = `
                <div class="list-header">
                    <h2>📌 ${escapeHtml(selected)}</h2>
                    <div class="item-actions">
                        <button type="button" class="btn btn-sm" data-action="rename">✏️ Переименовать</button>
                        <button type="button" class="btn btn-sm btn-danger" data-action="delete">🗑️ Удалить</button>
                    </div>
                </div>
                <form class="row" id="renameForm" hidden>
                    <input type="text" id="renameInput" value="${escapeHtml(selected)}" aria-label="Новое название">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" class="btn" data-action="cancel-rename">Отмена</button>
                </form>

                <h3 class="section-title">В списке (${movies.length})</h3>
                <div>${movies.length ? movies.map(m => movieRow(m, false)).join('') : '<div class="empty-state">Список пуст.</div>'}</div>

                <h3 class="section-title">Добавить из базы</h3>
                <input type="search" id="searchAddInput" placeholder="🔍 Поиск по названию" aria-label="Поиск фильма для добавления">
                <div class="mt" id="candidates"></div>`;
            renderCandidates();
        }

        function renderCandidates() {
            const q = normalizeSearch($('searchAddInput')?.value);
            const candidates = sortItems(items.filter(i => !splitList(i.customlists).includes(selected)
                && (!q || normalizeSearch(i.title).includes(q))), 'title');
            $('candidates').innerHTML = candidates.length
                ? candidates.slice(0, 50).map(m => movieRow(m, true)).join('')
                : '<div class="empty-state">Ничего не найдено.</div>';
        }

        function movieRow(m, isCandidate) {
            return `
            <div class="item">
                ${posterImg(m.poster, { size: 'small' })}
                <div class="item-info"><div class="item-title">${escapeHtml(m.title)}</div><div class="item-meta">${itemMeta(m)}</div></div>
                <div class="item-actions">
                    ${isCandidate
                        ? `<button type="button" class="btn btn-sm btn-success" data-add="${m.id}">+ Добавить</button>`
                        : `<button type="button" class="btn btn-sm btn-danger" data-remove="${m.id}">✕ Убрать</button>`}
                </div>
            </div>`;
        }

        const exists = (name) => lists.some(l => l.toLowerCase() === name.toLowerCase());

        $('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = $('newListInput').value.trim();
            if (!name) return;
            if (exists(name)) { alert('Такой список уже есть.'); return; }
            try {
                await run(db.from('lists').insert([{ name }]));
                $('newListInput').value = '';
                selected = name;
                await load();
            } catch (error) {
                showError('Не удалось создать список.', error);
            }
        });

        $('listsNav').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-list]');
            if (!btn) return;
            selected = btn.dataset.list;
            renderNav();
            renderContent();
            if (window.innerWidth <= 760) $('contentPanel').scrollIntoView({ behavior: 'smooth' });
        });

        async function setMovieLists(id, update) {
            const movie = items.find(m => String(m.id) === String(id));
            if (!movie) return;
            try {
                await run(db.from('collection').update({ customlists: update(splitList(movie.customlists)).join(', ') }).eq('id', movie.id));
                await load();
            } catch (error) {
                showError('Не удалось изменить список.', error);
            }
        }

        $('contentPanel').addEventListener('input', (e) => { if (e.target.id === 'searchAddInput') renderCandidates(); });

        $('contentPanel').addEventListener('submit', async (e) => {
            if (e.target.id !== 'renameForm') return;
            e.preventDefault();
            const newName = $('renameInput').value.trim();
            if (!newName || newName === selected) { renderContent(); return; }
            if (exists(newName)) { alert('Такой список уже есть.'); return; }
            try {
                await run(db.rpc('rename_list', { old_name: selected, new_name: newName }));
                selected = newName;
                await load();
            } catch (error) {
                showError('Не удалось переименовать список.', error);
            }
        });

        $('contentPanel').addEventListener('click', async (e) => {
            const add = e.target.closest('[data-add]');
            if (add) return setMovieLists(add.dataset.add, l => [...l, selected]);
            const remove = e.target.closest('[data-remove]');
            if (remove) return setMovieLists(remove.dataset.remove, l => l.filter(n => n !== selected));

            const action = e.target.closest('[data-action]')?.dataset.action;
            if (action === 'rename') {
                $('renameForm').hidden = false;
                $('renameInput').focus();
                $('renameInput').select();
            } else if (action === 'cancel-rename') {
                $('renameForm').hidden = true;
            } else if (action === 'delete') {
                const count = inList(selected).length;
                const msg = count
                    ? `Удалить список «${selected}»? Он пропадёт у ${count} записей, сами записи останутся.`
                    : `Удалить список «${selected}»?`;
                if (!confirm(msg)) return;
                try {
                    await run(db.rpc('delete_list', { list_name: selected }));
                    selected = null;
                    await load();
                } catch (error) {
                    showError('Не удалось удалить список.', error);
                }
            }
        });

        load();
    </script>
</body>
</html>
