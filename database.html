<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Админка — база</title>
    <link rel="icon" type="image/svg+xml" href="favicon-admin.svg">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <a class="admin-brand" href="index.html">MY<span>COLLECTION</span></a>
            <nav class="admin-nav" aria-label="Разделы админки">
                <a href="admin.html">➕ Добавление</a>
                <a href="admin.html#top100">🏆 ТОП-100</a>
                <a href="database.html">📋 База</a>
                <a href="lists.html">🗂️ Списки</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="panel">
            <h2>🪄 Автопоиск трейлеров</h2>
            <p class="hint">Найдёт трейлеры на YouTube для записей без трейлера и сразу сохранит их.</p>
            <button type="button" class="btn btn-primary" id="scanBtn">🔍 Найти недостающие трейлеры</button>
            <p class="status" id="scanProgress"></p>
            <div id="scanResults"></div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="🔍 Поиск по названию" aria-label="Поиск по названию">
                <select id="typeFilter" aria-label="Тип">
                    <option value="all">Все типы</option>
                    <option value="movies">Фильмы</option>
                    <option value="series">Сериалы</option>
                    <option value="cartoons">Мультфильмы</option>
                </select>
                <select id="sortSelect" aria-label="Сортировка">
                    <option value="default">Сначала новые записи</option>
                    <option value="title">По названию</option>
                    <option value="rating_desc">Рейтинг ↓</option>
                    <option value="rating_asc">Рейтинг ↑</option>
                    <option value="year_desc">Год ↓</option>
                    <option value="year_asc">Год ↑</option>
                </select>
            </div>
            <p class="hint" id="resultCount"></p>
            <div id="listContainer"><div class="empty-state">Загрузка…</div></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
    <script src="tmdb-helper.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        let items = [];

        async function load() {
            try {
                items = await run(db.from('collection')
                    .select('id,type,title,poster,year,rating,toprank,customlists,rewatch,trailer')
                    .order('id', { ascending: false }));
                render();
            } catch (error) {
                $('listContainer').innerHTML = '<div class="empty-state">Не удалось загрузить базу.</div>';
                console.error(error);
            }
        }

        function render() {
            const q = normalizeSearch($('searchInput').value);
            const type = $('typeFilter').value;
            let list = items.filter(i => (!q || normalizeSearch(i.title).includes(q)) && (type === 'all' || i.type === type));
            list = sortItems(list, $('sortSelect').value);

            $('resultCount').textContent = `Найдено: ${list.length} из ${items.length}`;
            if (!list.length) {
                $('listContainer').innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
                return;
            }
            $('listContainer').innerHTML = list.map(i => {
                const extra = [i.toprank > 0 ? `🏆 ${i.toprank}` : '', i.rewatch ? '🔄' : ''];
                const lists = splitList(i.customlists);
                const editUrl = `admin.html?edit=${encodeURIComponent(i.id)}`;
                return `
                <div class="item">
                    <a href="${editUrl}" tabindex="-1">${posterImg(i.poster, { size: 'small' })}</a>
                    <div class="item-info">
                        <a class="item-title" href="${editUrl}">${escapeHtml(i.title)}</a>
                        <div class="item-meta">${itemMeta(i, extra)}</div>
                        ${lists.length ? `<div class="item-meta">📌 ${lists.map(escapeHtml).join(', ')}</div>` : ''}
                    </div>
                    <div class="item-actions">
                        <a class="btn btn-sm" href="${editUrl}">✏️ Изменить</a>
                        <button type="button" class="btn btn-sm btn-danger" data-delete="${i.id}">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        let searchTimer;
        $('searchInput').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 150); });
        $('typeFilter').addEventListener('change', render);
        $('sortSelect').addEventListener('change', render);

        $('listContainer').addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-delete]');
            if (!btn) return;
            const item = items.find(i => String(i.id) === btn.dataset.delete);
            if (!item || !confirm(`Удалить «${item.title}»?`)) return;
            try {
                await run(db.from('collection').delete().eq('id', item.id));
                await load();
            } catch (error) {
                showError('Не удалось удалить запись.', error);
            }
        });

        $('scanBtn').addEventListener('click', async () => {
            const missing = items.filter(i => !i.trailer || !i.trailer.trim());
            const progress = $('scanProgress');
            const results = $('scanResults');
            results.innerHTML = '';
            if (!missing.length) {
                progress.textContent = '✅ У всех записей уже есть трейлер.';
                return;
            }

            $('scanBtn').disabled = true;
            let found = 0;
            for (const [idx, item] of missing.entries()) {
                progress.textContent = `Ищу трейлеры… ${idx + 1} из ${missing.length}`;
                const row = document.createElement('div');
                row.className = 'item';
                row.innerHTML = `<div class="item-info"><div class="item-title">${escapeHtml(item.title)}${item.year ? ` (${item.year})` : ''}</div><div class="item-meta">⏳ Поиск…</div></div>`;
                results.appendChild(row);
                const meta = row.querySelector('.item-meta');
                try {
                    const url = await findTrailerByTitle(item.title, item.type, item.year);
                    if (!url) { meta.textContent = '❌ Трейлер не найден'; continue; }
                    await run(db.from('collection').update({ trailer: url }).eq('id', item.id));
                    item.trailer = url;
                    found++;
                    meta.innerHTML = `✅ Сохранён: <a href="${escapeHtml(url)}" target="_blank" rel="noopener">смотреть</a>`;
                } catch (error) {
                    console.error(error);
                    meta.textContent = `⚠️ Ошибка: ${error.message || 'неизвестная'}`;
                }
            }
            progress.textContent = `Готово: обработано ${missing.length}, найдено ${found}.`;
            $('scanBtn').disabled = false;
        });

        load();
    </script>
</body>
</html>
