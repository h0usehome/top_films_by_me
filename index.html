<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Моя коллекция</title>
    <meta name="description" content="Личная коллекция фильмов, сериалов и мультфильмов: оценки, отзывы, трейлеры и ТОП-100.">
    <meta name="theme-color" content="#0f0f13">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Моя коллекция">
    <meta property="og:title" content="Моя коллекция фильмов">
    <meta property="og:description" content="Фильмы, сериалы и мультфильмы с моими оценками, отзывами и трейлерами.">
    <meta property="og:url" content="https://h0usehome.github.io/top_films_by_me/">
    <meta property="og:image" content="https://h0usehome.github.io/top_films_by_me/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://ktacbvcwsyajpeacdmwt.supabase.co" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://avatars.mds.yandex.net">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="common.js" defer></script>
    <script src="tg.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contentGrid">К содержимому</a>

    <nav class="sidebar" id="sidebar" aria-label="Разделы">
        <div class="brand">MY<span>COLLECTION</span></div>
        <a class="nav-item" href="./" data-nav data-key="main">Главная</a>

        <h3>Категории</h3>
        <a class="nav-item" href="?view=movies" data-nav data-key="movies">Фильмы</a>
        <a class="nav-item" href="?view=series" data-nav data-key="series">Сериалы</a>
        <a class="nav-item" href="?view=cartoons" data-nav data-key="cartoons">Мультфильмы</a>

        <h3>Подборки</h3>
        <a class="nav-item" href="?view=top100" data-nav data-key="top100">ТОП 100</a>
        <a class="nav-item" href="?view=new" data-nav data-key="new">Новинки</a>
        <a class="nav-item" href="?view=recent" data-nav data-key="recent">Недавно добавлено</a>
        <a class="nav-item" href="?view=rewatch" data-nav data-key="rewatch">Пересматриваем любимое</a>

        <h3 id="listsHeading" hidden>Мои списки</h3>
        <div id="dynamicLists"></div>
    </nav>
    <div class="sidebar-overlay" data-action="close-drawer"></div>

    <main class="main">
        <header class="header" id="header">
            <div class="header-row">
                <button type="button" class="icon-btn burger" id="burger" data-action="drawer" aria-label="Меню" aria-controls="sidebar" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <a class="icon-btn back-btn" id="backToMain" href="./" data-nav aria-label="На главную" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
                </a>
                <h1 class="page-title" id="pageTitle">Главная</h1>
                <form class="search" id="searchForm" role="search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <input type="search" id="search" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off" enterkeyhint="search">
                </form>
                <button type="button" class="icon-btn search-toggle" data-action="search" aria-label="Поиск">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                </button>
            </div>

            <div class="filters" id="filtersBar" hidden>
                <select class="select" id="genreSelect" aria-label="Жанр">
                    <option value="all">Все жанры</option>
                </select>
                <select class="select" id="sortSelect" aria-label="Сортировка">
                    <option value="default">По умолчанию</option>
                    <option value="rating_desc">Рейтинг ↓</option>
                    <option value="rating_asc">Рейтинг ↑</option>
                    <option value="year_desc">Сначала новые</option>
                    <option value="year_asc">Сначала старые</option>
                    <option value="title">По названию</option>
                </select>
                <span class="result-count" id="resultCount"></span>
            </div>
        </header>

        <div class="content">
            <div class="grid" id="contentGrid" aria-live="polite">
                <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
            </div>
        </div>
    </main>

    <nav class="tabbar" aria-label="Основные разделы">
        <a href="./" data-nav data-key="main">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная
        </a>
        <a href="?view=movies" data-nav data-key="movies">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Фильмы
        </a>
        <a href="?view=series" data-nav data-key="series">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Сериалы
        </a>
        <a href="?view=cartoons" data-nav data-key="cartoons">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>Мульты
        </a>
        <a href="?view=top100" data-nav data-key="top100">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>ТОП
        </a>
    </nav>

    <div class="modal-overlay" id="modalOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="filmTitle">
            <button type="button" class="modal-close" data-action="close-film" aria-label="Закрыть">&times;</button>
            <div class="modal-scroll" id="modalContent">
                <div class="film" id="modalBody"></div>
            </div>
        </div>
    </div>

    <div class="trailer-overlay" id="trailerOverlay" hidden>
        <button type="button" class="modal-close" data-action="close-trailer" aria-label="Закрыть трейлер">&times;</button>
        <div class="trailer-frame" id="trailerFrame"></div>
    </div>
</body>
</html>
